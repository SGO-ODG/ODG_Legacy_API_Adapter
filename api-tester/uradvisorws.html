<!DOCTYPE html>
<html>
	<head>
		<title>ODG UR Advisor DEV (API Adapter) Web Service Tester</title>
		<!-- Stylesheet & Javascript (Begin) -->
      <link rel="stylesheet" type="text/css" href="css/reset.css"/>
      <link rel="stylesheet" type="text/css" href="css/text.css"/>
      <link rel="stylesheet" type="text/css" href="css/960_12_col.css"/>
		<script type="text/javascript" src="jscripts/jquery-1.9.1.min.js"></script>
		<script type="text/javascript" src="jscripts/jquery.blockUI.js"></script>
		<script type="text/javascript" src="jscripts/formatData.js"></script>
		<script type="text/javascript" src="jscripts/moment.js"></script>
		<script type="text/javascript" src="jscripts/purify.min.js"></script>
		<style type="text/css">
			body { font-family: "Arial", Helvetica, sans-serif; font-size:12px; }
			.input { border: 1px #000000 solid; }
			.cb { border: 1px #000000 solid; vertical-align: middle; text-align: center; }
			label, .bold { font-weight: 700; }
			p { margin-bottom: 5px; }
			#responseTime { color: #ff00ff; }
			#url { color: #0000ff; }
			#result { white-space: pre; overflow: scroll; padding: 5px; }
			.center { text-align: center; }
			.note { color: #ff0000; }
			.home { float: right; }
		</style>
		<script type="text/javascript">
			$(document).ready(function() {
				// change prompts on country selection
				$('#country').change(function(event) {
					if(event.currentTarget.value == 'AU') {
						$('#oth').text('PROC');
						$('#oth1').text('PROC');
					}
					else {
						$('#oth').text('CPT');
						$('#oth1').text('CPT');
					}
				});
				// if submit is clicked
				$('#submit').click(function(event) {
					// clear response time
					$('#responseTime').html('');
					event.preventDefault();	// stop form submit
					// build url for getting data
					var urlloc = '';
					var flags = '';
					if($('#icdcode').val().length) {
						urlloc += '/icd/' + DOMPurify.sanitize($('#icdcode').val());
					}
					if($('#bpcode').val().length && $('#noicode').val().length) {
						urlloc += '/bp/' + DOMPurify.sanitize($('#bpcode').val()) + '/noi/' + DOMPurify.sanitize($('#noicode').val());
					}
					if($('#othcode').val().length) {
						urlloc += (($('#country').val() == "AU") ? '/proc/' : '/cpt/') + DOMPurify.sanitize($('#othcode').val());
					}
					if($('#country').val() == "AU") {	// for Australian Customer (Default US)
						urlloc += '/country/' + $('#country').val();
					}
					if($('#redcb').is(':checked')) {
						flags += $('#redcb').val();
					}
					if($('#greencb').is(':checked')) {
						flags += $('#greencb').val();
					}
					if($('#yellowcb').is(':checked')) {
						flags += $('#yellowcb').val();
					}
					if($('#blackcb').is(':checked')) {
						flags += $('#blackcb').val();
					}
					if(flags != '') {
						urlloc += '/flags/' + flags;
					}
					// build xml - end
					var wsURL = 'http://localhost:3000/restws/uradvisor' + urlloc + (($("input[name='format']:checked").val() == 'JSON') ? '/format/json' : '') +
								   (($('#clientid').val()) ? '/clientid/' + DOMPurify.sanitize($('#clientid').val()) : '')+
								   (($("input[name='output']:checked").val() == 'F') ? '/output/F' : '');				
					$('#url').html(wsURL);
					var startTimeStamp ;
					var endTimeStamp;								   
					$.ajax({
					  type: 'GET',
					  url: wsURL,
					  cache: false,
					  beforeSend: function (request) {
					  	 $.blockUI();
		             request.setRequestHeader("X-ODG-KEY", $('#apikey').val());
		             startTimeStamp = moment();
	    		     },
					  async: true,
					  dataType: 'text',
					  success: function(outData) {
					  	  endTimeStamp = moment();
					     // format output
					  	  if($("input[name='format']:checked").val() == 'JSON') {
					  	     $('#result').text(formatJson(outData));
					  	  }
					  	  else {
					     	  $('#result').text(formatXml(outData));
					     }
					  },
					  error: function(xhr) {
					  	  endTimeStamp = moment();
					  	  if($("input[name='format']:checked").val() == 'JSON') {
					  	  		var jsonText = formatJson(xhr.responseText);
					  	  		if(jsonText) {
					  	  			$('#result').text(jsonText);
					  	  		}
					  	  		else {
					  	  			$('#result').text(xhr.responseText);
					  	  		}
					  	  }
					  	  else {
					     	  $('#result').text(formatXml(xhr.responseText));
					     }
					  },
					  complete: function() { 
					  	  $('#responseTime').html('<b>Start Time: ' + startTimeStamp.format('hh:mm:ss.SSS') + '<>End Time: ' + endTimeStamp.format('hh:mm:ss.SSS') + '<>Total Time: ' + endTimeStamp.diff(startTimeStamp,'seconds',true) + ' seconds</b>');
					     $.unblockUI(); 
					  }
					});
				});
			});
		</script>
		<!-- Stylesheet & Javascript (End) -->
	</head>

   <body>
      <!-- canvas begin -->
      <div class="container_12" id="canvas">
         <form name="calculator" id="calculator" method="post" action="">
            <div class="grid_12 center" id="header" style="margin: 15px 0px 15px 0px; line-height: 24px;">
               <p><h1>ODG v3.1.11 UR Advisor <font color='red'>DEV - API Adapter</font> Web Service Tester</h1><span class="home"><a href="index.html">Go To Home Page</a></span></p>
            </div>
            <!-- API Key -->
            <div class="grid_2"><p><label for="apikey">API Key:</label></p></div>
            <div class="grid_4"><p><input type="password" name="apikey" id="apikey" size="40" value="e3cf1a3d593197bd7d2aa91afc1f9ffd5add2cd5" class="input" tabindex="105"></p></div>
            <div class="grid_2"><p><label for="format">Output Format:</label></p></div>
            <div class="grid_4">
            	<p>
                  <input type="radio" name="format" id="formatxml" value="XML" tabindex="106" checked=checked>XML
                  <input type="radio" name="format" id="formatjson" value="JSON" tabindex="107">JSON
            	</p>
           	</div>
            <div class="clear"></div>
            <div class="grid_2"><p><label for="age">Client ID:</label></p></div>
            <div class="grid_4"><p><input type="text" name="clientid" id="clientid" size="20" value="" class="input" tabindex="110"></p></div>
            <div class="grid_2"><p><label for="country">Country:</label></p></div>
            <div class="grid_4">
            	<select name="country" id="country" size="1" class="input">
            		<option value="AU">Australia</option>
            		<option value="US" selected>United States</option>
            	</select>
            </div>
            <div class="clear"></div>
            <!-- approve flag colors selection -->
            <div class="grid_2"><p><label for="age">Approve Flag:</label></p></div>
            <div class="grid_10">
            	<p>
            		Green<input type="checkbox" name="greencb" id="greencb" value="G" class="cb" tabindex="111" title="If checked, filter results for selected approve flag[s] only.">
            		Yellow<input type="checkbox" name="yellowcb" id="yellowcb" value="Y" class="cb" tabindex="112" title="If checked, filter results for selected approve flag[s] only.">
            		Red<input type="checkbox" name="redcb" id="redcb" value="R" class="cb" tabindex="113" title="If checked, filter results for selected approve flag[s] only.">
            		Black<input type="checkbox" name="blackcb" id="blackcb" value="B" class="cb" tabindex="114" title="If checked, filter results for selected approve flag[s] only.">
            	</p>
            </div>
            <div class="clear"></div>
            <!-- icd code -->
            <div class="grid_2"><p><label for="icdcode">ICD Code:</label></p></div>
            <div class="grid_4"><p><input type="text" name="icdcode" id="icdcode" size="40" value="" class="input" tabindex="115"></p></div>
            <div class="grid_2"><p><label for="othcode"><span id="oth">CPT</span> Code:</label></p></div>
            <div class="grid_4"><p><input type="text" name="othcode" id="othcode" size="40" value="" class="input" tabindex="120"></p></div>
            <div class="clear"></div>
            <!-- FNOL Code -->
            <div class="grid_2"><p class="bold">Body Part Code:</label></p></div>
			<div class="grid_4"><input type="text" name="bpcode" id="bpcode" value="" size="4" maxlength="2" class="input" tabindex="121"></div>
            <div class="grid_2"><p class="bold">Nature of Injury Code:</label></p></div>
			<div class="grid_4"><input type="text" name="noicode" id="noicode" value="" size="4" maxlength="2" class="input" tabindex="122"></div>
            <div class="clear"></div>            
            <div class="prefix_2 grid_10"><p class="note">Note: if you want all ICD codes for given <span id="oth1">CPT</span> code (or codes) pass either 9 or 10 in ICD code.</p></div>
            <div class="clear"></div>
            <div class="prefix_2 grid_10"><b>Web Service URL: </b><span id="url"></span></div>
            <div class="clear"></div>
         	<div class="grid_12"><p><input type="submit" name="submit" id="submit" value="Test WebService" tabindex="300" class="button"></p></div>
         </form>
         <br />
         <p style="font-weight:700; padding-left:10px;">Output Response XML/JSON:&nbsp;&nbsp;<span id="responseTime"></span></p>
			<div class="grid_12" style='height:400px; border:1px solid #000000;' id="result"></div>
         <div class="clear"></div>
         <br />
      </div>
   </body>
</html>
