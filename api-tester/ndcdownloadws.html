<!DOCTYPE html>
<html>
	<head>
		<title>ODG Formulary Advisor DEV (API Adapter - Full Download) Web Service Tester</title>
		<!-- Stylesheet & Javascript (Begin) -->
      <link rel="stylesheet" type="text/css" href="css/reset.css"/>
      <link rel="stylesheet" type="text/css" href="css/text.css"/>
      <link rel="stylesheet" type="text/css" href="css/960_12_col.css"/>
		<script type="text/javascript" src="jscripts/jquery-1.9.1.min.js"></script>
		<script type="text/javascript" src="jscripts/jquery.blockUI.js"></script>
		<script type="text/javascript" src="jscripts/formatData.js"></script>
		<script type="text/javascript" src="jscripts/moment.js"></script>
		<script type="text/javascript" src="jscripts/purify.min.js"></script>
		<style type="text/css">
			body { font-family: "Arial", Helvetica, sans-serif; font-size:12px; }
			.input { border: 1px #000000 solid; }
			label, .bold { font-weight: 700; }
			#responseTime { color: #ff00ff; }
			#url { color: #0000ff; }
			p { margin-bottom: 5px; }
			#result { white-space: pre; overflow: scroll; padding: 5px; }
			.center { text-align: center; }
			.home { float: right; }
		</style>
		<script type="text/javascript">
			$(document).ready(function() {
				// if submit is clicked
				$('#submit').click(function(event) {
					// clear response time
					$('#responseTime').html('');
					event.preventDefault();	// stop form submit
					// build url - end
					var wsURL = 'http://localhost:3000/restws/ndcdownload' + (($("input[name='format']:checked").val() == 'JSON') ? '/format/json' : '') +
									(($('#clientid').val()) ? '/clientid/' + DOMPurify.sanitize($('#clientid').val()) : '') +
                                                                        (($("input[name='output']:checked").val() == 'F') ? '/output/F' : '');
					$('#url').html(wsURL);
					var startTimeStamp ;
					var endTimeStamp;								   
					$.ajax({
					  type: 'GET',
					  url: wsURL,
					  cache: false,
					  beforeSend: function (request) {
					  	 $.blockUI();
		             request.setRequestHeader("X-ODG-KEY", $('#apikey').val());
		             startTimeStamp = moment();
	    		     },
					  async: true,
					  dataType: 'text',
					  success: function(outData) {
					  	  endTimeStamp = moment();
					     // format output
					  	  if($("input[name='format']:checked").val() == 'JSON') {
					  	     $('#result').text(formatJson(outData));
					  	  }
					  	  else {
					     	  $('#result').text(formatXml(outData));
					     }
					  },
					  error: function(xhr) {
					  	  endTimeStamp = moment();
					  	  if($("input[name='format']:checked").val() == 'JSON') {
					  	  		var jsonText = formatJson(xhr.responseText);
					  	  		if(jsonText) {
					  	  			$('#result').text(jsonText);
					  	  }
					  	  else {
					  	  			$('#result').text(xhr.responseText);
					  	  		}
					  	  }
					  	  else {
					     	  $('#result').text(formatXml(xhr.responseText));
					     }
					  },
					  complete: function() {
					     $('#responseTime').html('<b>Start Time: ' + startTimeStamp.format('hh:mm:ss.SSS') + '<>End Time: ' + endTimeStamp.format('hh:mm:ss.SSS') + '<>Total Time: ' + endTimeStamp.diff(startTimeStamp,'seconds',true) + ' seconds</b>');
					     $.unblockUI(); 
					  }
					});
				});
			});
		</script>
		<!-- Stylesheet & Javascript (End) -->
	</head>

   <body>
      <!-- canvas begin -->
      <div class="container_12" id="canvas">
         <form name="calculator" id="calculator" method="post" action="">
            <div class="grid_12 center" id="header" style="margin: 15px 0px 15px 0px; line-height: 24px;">
               <p><h1>ODG v3.1.11 Formulary Advisor (Full Download) <font color='red'>DEV - API Adapter</font> Web Service Tester</h1><span class="home"><a href="index.html">Go To Home Page</a></span></p>
            </div>
            <!-- API Key -->
            <div class="grid_2"><p><label for="apikey">API Key:</label></p></div>
            <div class="grid_4"><p><input type="password" name="apikey" id="apikey" size="40" value="58dff37601628edafaea9a0a643b6a742905ee3b" class="input" tabindex="105"></p></div>
            <div class="grid_2"><p><label for="format">Output Format:</label></p></div>
            <div class="grid_4">
            	<p>
                  <input type="radio" name="format" id="formatxml" value="XML" tabindex="106" checked=checked>XML
                  <input type="radio" name="format" id="formatjson" value="JSON" tabindex="107">JSON
            	</p>
           	</div>
            <div class="clear"></div>
            <!-- client id & ndc code -->
            <div class="grid_2"><p><label for="age">Client ID:</label></p></div>
            <div class="grid_4"><p><input type="text" name="clientid" id="clientid" size="20" value="" class="input" tabindex="120"></p></div>
            <div class="grid_2"><p><label for="country">Country:</label></p></div>
            <div class="grid_4">
            	<select name="country" id="country" size="1" class="input">
            		<option value="AU">Australia</option>
            		<option value="US" selected>United States</option>
            	</select>
            </div>
            <div class="clear"></div>
            <div class="prefix_2 grid_10"><b>Web Service URL: </b><span id="url"></span></div>
            <div class="clear"></div>
         	<div class="grid_12"><p><input type="submit" name="submit" id="submit" value="Test WebService" tabindex="300" class="button"></p></div>
         </form>
         <br />
         <p style="font-weight:700; padding-left:10px;">Output Response XML/JSON:&nbsp;&nbsp;<span id="responseTime"></span></p>
			<div class="grid_12" style='height:400px; border:1px solid #000000;' id="result"></div>
         <div class="clear"></div>
         <br />
      </div>
   </body>
</html>
